<form (ngSubmit)="onSubmit()">
  <p class="welcome-text">
    @if (subtitle()) {
      {{ subtitle() }}
    } @else {
      {{ 'verify.code_sent' | translate }} <strong>{{ email() }}</strong>.
    }
  </p>

  <app-form-error [message]="errorMessage()" />

  <div class="mb-3 text-start">
    <label for="code-step-input" class="form-label">{{ 'verify.code_label' | translate }}</label>
    <input
      id="code-step-input"
      type="text"
      class="form-control"
      [formControl]="codeControl"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      placeholder="123456"
    >
    @if (codeControl.invalid && codeControl.touched) {
      <div class="form-text text-danger">{{ 'verify.code_invalid' | translate }}</div>
    }
  </div>

  <button type="submit" class="btn btn-primary w-100 mb-2" [disabled]="loading()">
    @if (loading()) {
      <app-loading-spinner />
    }
    {{ submitLabel() || ('auth.register.code_submit' | translate) }}
  </button>

  <div class="d-flex justify-content-between">
    <button type="button" class="btn btn-link p-0" (click)="back.emit()">{{ 'verify.change_email' | translate }}</button>
    <button type="button" class="btn btn-link p-0" (click)="resend.emit()">{{ 'verify.resend_code' | translate }}</button>
  </div>
</form>
