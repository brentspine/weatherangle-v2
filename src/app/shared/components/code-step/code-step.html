<form (ngSubmit)="onSubmit()">
  <p class="welcome-text">
    @if (subtitle()) {
      {{ subtitle() }}
    } @else {
      {{ i18n.t('codeStep.sentToBefore') }} <strong>{{ email() }}</strong>{{ i18n.t('codeStep.sentToAfter') }}
    }
  </p>

  <app-form-error [message]="errorMessage()" />

  <div class="mb-3 text-start">
    <label for="code-step-input" class="form-label">{{ i18n.t('codeStep.label') }}</label>
    <input
      id="code-step-input"
      type="text"
      class="form-control"
      [formControl]="codeControl"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      placeholder="123456"
    >
    @if (codeControl.invalid && codeControl.touched) {
      <div class="form-text text-danger">{{ i18n.t('codeStep.invalidCode') }}</div>
    }
  </div>

  <button type="submit" class="btn btn-primary w-100 mb-2" [disabled]="loading()">
    @if (loading()) {
      <app-loading-spinner />
    }
    {{ submitLabel() || i18n.t('codeStep.verify') }}
  </button>

  <div class="d-flex justify-content-between">
    <button type="button" class="btn btn-link p-0" (click)="back.emit()">{{ backLabel() || i18n.t('codeStep.changeEmail') }}</button>
    <button type="button" class="btn btn-link p-0" (click)="resend.emit()">{{ i18n.t('codeStep.resendCode') }}</button>
  </div>
</form>
