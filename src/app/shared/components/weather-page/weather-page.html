<div class="weather-page">
  <section class="left-column">
    <app-day-nav
      [days]="daily()"
      [selectedIndex]="selectedDayIndex()"
      (daySelected)="onDaySelected($event)"
    />

    @if (selectedDaily(); as day) {
      <app-weather-card variant="outside" [title]="(day.time | dayMonth) + ' ' + i18n.t('weather.overview')">
        <app-metric-grid [metrics]="metricsCardA()" />
      </app-weather-card>

      <app-weather-card variant="outside" [title]="(day.time | dayMonth) + ' ' + i18n.t('weather.overview')">
        <app-metric-grid [metrics]="metricsCardB()" />
      </app-weather-card>
    }

    <div class="info-warning-row">
      <app-weather-card variant="colored-header" accent="blue" icon="info" [title]="i18n.t('weather.currentInfo')">
        <p class="placeholder-text">{{ i18n.t('weather.noInfo') }}</p>
      </app-weather-card>
      <app-weather-card variant="colored-header" accent="red" icon="warning" [title]="i18n.t('weather.currentWarnings')">
        <p class="placeholder-text">{{ i18n.t('weather.noWarnings') }}</p>
      </app-weather-card>
    </div>
  </section>

  <section class="right-column">
    <p class="temperature">{{ rightTemperature() | metricValue: 'celsius' }}</p>
    <h1 class="place-name">{{ placeName() }}</h1>
    <p class="lat-lon">{{ i18n.t('weather.lat') }}: {{ location().lat }}&nbsp;&nbsp;&nbsp;&nbsp;{{ i18n.t('weather.lon') }}: {{ location().lon }}</p>

    <div class="toggle-row">
      <app-icon-toggle-button
        icon="star"
        [active]="isStartPage()"
        [ariaLabel]="i18n.t('weather.setStartPage')"
        (toggled)="onStartPageToggled($event)"
      />
      <app-icon-toggle-button
        icon="favorite"
        [active]="isFavorite()"
        [ariaLabel]="i18n.t('weather.setFavorite')"
        (toggled)="onFavoriteToggled($event)"
      />
    </div>

    <app-weather-map
      [lat]="location().lat"
      [lon]="location().lon"
      [boundingBox]="location().boundingBox"
      [markerLabel]="placeName()"
      (nearbySettlementSelected)="onNearbySettlementSelected($event)"
    />
  </section>
</div>
