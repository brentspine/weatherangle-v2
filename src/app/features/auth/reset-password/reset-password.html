<app-auth-layout [title]="i18n.t('resetPassword.title')">
  <app-form-error [message]="errorMessage()" />

  @if (!resetToken()) {
    <app-verification-stepper [texts]="texts()" [endpoints]="endpoints" (verified)="onVerified($event)" />
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3 text-start">
        <label for="new-password-input" class="form-label">{{ i18n.t('resetPassword.newPassword') }}</label>
        <input
          id="new-password-input"
          type="password"
          class="form-control"
          formControlName="newPassword"
          autocomplete="new-password"
          [placeholder]="i18n.t('resetPassword.newPassword')"
        >
      </div>

      <div class="mb-3 text-start">
        <label for="confirm-password-input" class="form-label">{{ i18n.t('resetPassword.confirmPassword') }}</label>
        <input
          id="confirm-password-input"
          type="password"
          class="form-control"
          formControlName="confirmPassword"
          autocomplete="new-password"
          [placeholder]="i18n.t('resetPassword.confirmPassword')"
        >
        @if (form.errors?.['passwordsMismatch'] && form.get('confirmPassword')?.touched) {
          <div class="form-text text-danger">{{ i18n.t('resetPassword.passwordsMismatch') }}</div>
        }
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
        @if (loading()) {
          <app-loading-spinner />
        }
        {{ i18n.t('resetPassword.submit') }}
      </button>
    </form>
  }

  <p class="create-account">
    <a routerLink="/login">{{ i18n.t('resetPassword.backToSignIn') }}</a>
  </p>
</app-auth-layout>
