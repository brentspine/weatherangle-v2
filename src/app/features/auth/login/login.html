<app-auth-layout
  [title]="'auth.login.title' | translate"
  [subtitle]="'auth.login.subtitle' | translate"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-form-error [message]="errorMessage()" />

    <div class="mb-3 text-start">
      <label for="username-input" class="form-label">{{ 'auth.username' | translate }}</label>
      <input
        id="username-input"
        type="text"
        class="form-control"
        formControlName="username"
        autocomplete="username"
        [placeholder]="'auth.username' | translate"
      >
    </div>

    <div class="mb-3 text-start">
      <label for="password-input" class="form-label">{{ 'auth.password' | translate }}</label>
      <input
        id="password-input"
        type="password"
        class="form-control"
        formControlName="password"
        autocomplete="current-password"
        [placeholder]="'auth.password' | translate"
      >
    </div>

    <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="loading()">
      @if (loading()) {
        <app-loading-spinner />
      }
      {{ 'auth.login.submit' | translate }}
    </button>

    <p class="create-account">
      <a routerLink="/password-reset">{{ 'auth.login.forgot_password' | translate }}</a>
    </p>
    <p class="create-account">
      {{ 'auth.login.no_account' | translate }} <a routerLink="/register">{{ 'auth.login.register_link' | translate }}</a>
    </p>
  </form>
</app-auth-layout>
