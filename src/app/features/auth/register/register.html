<app-auth-layout [title]="'auth.register.title' | translate">
  @if (!verificationToken()) {
    <app-verification-stepper [texts]="texts" [endpoints]="endpoints" (verified)="onVerified($event)" />
  } @else {
    <h2 class="welcome-header">{{ 'auth.register.final_title' | translate }}</h2>
    <p class="welcome-text">{{ 'auth.register.final_subtitle' | translate }}</p>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-form-error [message]="errorMessage()" />

      <div class="mb-3 text-start">
        <label for="register-username-input" class="form-label">{{ 'auth.username' | translate }}</label>
        <input
          id="register-username-input"
          type="text"
          class="form-control"
          formControlName="username"
          autocomplete="username"
          [placeholder]="'auth.username' | translate"
        >
      </div>

      <div class="mb-3 text-start">
        <label for="register-password-input" class="form-label">{{ 'auth.password' | translate }}</label>
        <input
          id="register-password-input"
          type="password"
          class="form-control"
          formControlName="password"
          autocomplete="new-password"
          [placeholder]="'auth.password' | translate"
        >
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
        @if (loading()) {
          <app-loading-spinner />
        }
        {{ 'auth.register.submit' | translate }}
      </button>
    </form>
  }

  <p class="create-account">
    {{ 'auth.register.has_account' | translate }} <a routerLink="/login">{{ 'auth.register.login_link' | translate }}</a>
  </p>
</app-auth-layout>
