<app-auth-layout [title]="i18n.t('register.title')">
  @if (!verificationToken()) {
    <app-verification-stepper [texts]="texts()" [endpoints]="endpoints" (verified)="onVerified($event)" />
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-form-error [message]="errorMessage()" />

      <div class="mb-3 text-start">
        <label for="register-username-input" class="form-label">{{ i18n.t('register.username') }}</label>
        <input
          id="register-username-input"
          type="text"
          class="form-control"
          formControlName="username"
          autocomplete="username"
          [placeholder]="i18n.t('register.username')"
        >
      </div>

      <div class="mb-3 text-start">
        <label for="register-password-input" class="form-label">{{ i18n.t('register.password') }}</label>
        <input
          id="register-password-input"
          type="password"
          class="form-control"
          formControlName="password"
          autocomplete="new-password"
          [placeholder]="i18n.t('register.password')"
        >
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
        @if (loading()) {
          <app-loading-spinner />
        }
        {{ i18n.t('register.submit') }}
      </button>
    </form>
  }

  <p class="create-account">
    {{ i18n.t('register.alreadyHaveAccount') }} <a routerLink="/login">{{ i18n.t('register.signIn') }}</a>
  </p>
</app-auth-layout>
