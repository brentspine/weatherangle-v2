<h3 class="change-password-title">{{ i18n.t('account.security.changePasswordTitle') }}</h3>

<app-form-error [message]="error()" />

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="mb-3 text-start">
    <label for="sec-new-password" class="form-label">{{ i18n.t('account.newPassword') }}</label>
    <input
      id="sec-new-password"
      type="password"
      class="form-control"
      formControlName="newPassword"
      autocomplete="new-password"
      [placeholder]="i18n.t('account.newPassword')"
    >
  </div>
  <div class="mb-3 text-start">
    <label for="sec-confirm-password" class="form-label">{{ i18n.t('account.confirmPassword') }}</label>
    <input
      id="sec-confirm-password"
      type="password"
      class="form-control"
      formControlName="confirmPassword"
      autocomplete="new-password"
      [placeholder]="i18n.t('account.confirmPassword')"
    >
    @if (form.errors?.['passwordsMismatch'] && form.get('confirmPassword')?.touched) {
      <div class="form-text text-danger">{{ i18n.t('account.passwordsMismatch') }}</div>
    }
  </div>
  <button
    type="submit"
    class="btn btn-primary w-100"
    [disabled]="loading()"
  >
    @if (loading()) {
      <app-loading-spinner />
    }
    {{ i18n.t('account.savePassword') }}
  </button>
</form>
